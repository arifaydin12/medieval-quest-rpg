<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Medieval Quest: a browser role-playing game with quests, turn-based combat, crafting and a living world.">
    <meta name="theme-color" content="#0d0b09">
    <title>Medieval Quest - Play</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%9C%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body data-screen="title">
    <a class="skip-link" href="#scene">Skip to the game</a>
    <div id="boot" class="boot" role="status" aria-live="polite">
        <div class="boot-inner"><div class="spinner" aria-hidden="true"></div><p class="font-title">Loading the realm...</p></div>
    </div>
    <noscript><div class="noscript">Medieval Quest needs JavaScript to run. Please enable it and reload the page.</div></noscript>

    <!-- Title screen -->
    <main id="title-screen" class="title-screen">
        <div class="title-card">
            <p class="title-kicker font-title">A role-playing adventure</p>
            <h1 class="title-name font-title">Medieval Quest</h1>
            <p class="title-tag">Forge your destiny in a realm of steel, shadow and stone.</p>
            <div class="title-menu">
                <button id="btn-continue" class="btn btn-gold btn-big" data-action="continue" disabled></button>
                <button class="btn btn-big" data-action="start-new"><span aria-hidden="true">✨</span> New Game</button>
                <div class="title-row">
                    <button class="btn" data-action="open-load"><span aria-hidden="true">📂</span> Load</button>
                    <button class="btn" data-action="open-settings"><span aria-hidden="true">⚙️</span> Settings</button>
                    <button class="btn" data-action="open-help"><span aria-hidden="true">❓</span> How to Play</button>
                </div>
            </div>
            <dl class="title-stats" aria-label="Lifetime statistics">
                <div><dt>Time played</dt><dd id="stat-playtime">0m</dd></div>
                <div><dt>Quests completed</dt><dd id="stat-quests">0</dd></div>
                <div><dt>Achievements</dt><dd id="stat-achievements">0/8</dd></div>
            </dl>
            <a class="back-link" href="index.html">← Back to the landing page</a>
        </div>
    </main>

    <!-- Game -->
    <div id="game" class="game" hidden data-panel="scene">
        <header id="topbar" class="topbar"></header>
        <div class="game-grid">
            <section id="panel-hero" class="panel panel-hero" data-panel-id="hero" aria-label="Hero"></section>
            <main id="scene" class="panel panel-scene" data-panel-id="scene" aria-label="Current location"></main>
            <aside class="col-right">
                <section class="panel panel-quests" data-panel-id="quests" aria-labelledby="quests-h">
                    <h2 id="quests-h" class="panel-title font-title">Quests</h2>
                    <div id="panel-quests-body"></div>
                </section>
                <section class="panel panel-log" data-panel-id="log" aria-labelledby="log-h">
                    <h2 id="log-h" class="panel-title font-title">Chronicle</h2>
                    <div id="panel-log-body"></div>
                </section>
            </aside>
        </div>
        <nav class="tabbar" aria-label="Game panels">
            <button data-action="panel" data-panel="scene" aria-pressed="true"><span aria-hidden="true">🏰</span>Place</button>
            <button data-action="panel" data-panel="hero" aria-pressed="false"><span aria-hidden="true">🧙</span>Hero</button>
            <button data-action="panel" data-panel="quests" aria-pressed="false"><span aria-hidden="true">📜</span>Quests</button>
            <button data-action="panel" data-panel="log" aria-pressed="false"><span aria-hidden="true">🕯️</span>Log</button>
        </nav>
        <div id="save-indicator" class="save-indicator" role="status" aria-live="polite"></div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

    <script src="gamedata.js"></script>
    <script src="audio.js"></script>
    <script src="system.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
